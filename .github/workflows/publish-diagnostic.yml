name: Publish diagnostic image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/chubban-lgtm/ha-eufy-sdk-bridge

jobs:
  publish-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push diagnostic image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:p2p-diagnostics
          build-args: |
            SDK_GIT_REF=diagnostics/p2p-root-cause
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published `$IMAGE:p2p-diagnostics`"
            echo ""
            echo "Bridge baseline: upstream dev."
            echo "SDK overlay: chubban-lgtm/eufy-sdk @ diagnostics/p2p-root-cause."
            echo "Platforms: linux/amd64, linux/arm64."
          } >> "$GITHUB_STEP_SUMMARY"
